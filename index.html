<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Applied Quixotics</title>
<meta name="description" content="Applied Quixotics — Medical Product Sourcing & Commercial Partnerships">
<style>
:root{--paper:#fff;--ink:#171717;--muted:#5f5f5f;--contact:#7a4937}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
body{min-height:100svh;display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif}
main{width:min(94vw,980px);text-align:center;padding:clamp(28px,6vh,72px) 20px clamp(44px,9vh,100px)}
.wordmark{display:block;width:min(92vw,820px);height:auto;margin:0 auto clamp(28px,4.5vh,48px)}
.tagline{margin:0 auto;max-width:980px;font-size:clamp(14px,1.85vw,20px);font-weight:400;line-height:1.55;letter-spacing:.11em;text-transform:uppercase}
.principle{margin:clamp(28px,4.5vh,46px) auto 0;max-width:760px;color:var(--muted);font-family:Georgia,"Times New Roman",serif;font-size:clamp(16px,2vw,21px);line-height:1.55;font-style:italic}
.contact{display:inline-block;margin-top:clamp(38px,6vh,64px);color:var(--contact);font-family:Georgia,"Times New Roman",serif;font-size:clamp(17px,2.1vw,23px);line-height:1.4;letter-spacing:.08em;text-decoration:none}
.contact:hover,.contact:focus-visible{text-decoration:underline;text-underline-offset:.18em}
@media(max-width:560px){main{width:100%}.wordmark{width:min(96vw,820px)}.tagline{letter-spacing:.07em}.principle{font-size:16px}.contact{letter-spacing:.04em}}
</style>
</head>
<body>
<main>
<img class="wordmark" src="applied-quixotics-wordmark.png" alt="Applied Quixotics — kee ah tics">
<p class="tagline">Medical Product Sourcing &amp; Commercial Partnerships</p>
<p class="principle">“What’s the easiest thing you can do for someone that’s hard for them to do?”</p>
<a class="contact" href="mailto:Contact@AppliedQuixotics.com">Contact@AppliedQuixotics.com</a>
</main>
</body>
</html>
